[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-agent"
version = "0.1.0"
description = "Source-linked quotation classification, comparison and procurement reports"
readme = "PUBLIC_README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]

[project.scripts]
valuation-agent = "valuation_agent.cli:main"

[tool.setuptools.packages.find]
include = ["valuation_agent*"]

[tool.setuptools]
include-package-data = false
