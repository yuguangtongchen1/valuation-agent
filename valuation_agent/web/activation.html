<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采购估价 · 激活</title><style>body{margin:0;background:#f7faf8;color:#193a2d;font:16px/1.6 system-ui,sans-serif}main{max-width:620px;margin:12vh auto;padding:32px;background:white;border:1px solid #d9e4df;border-radius:8px}input,button{font:inherit;padding:12px;border:1px solid #adc7b9;border-radius:6px}input{box-sizing:border-box;width:100%;margin:14px 0}button{background:#20634f;color:white;cursor:pointer}#status{color:#9b3025}</style></head><body><main><h1>采购估价</h1><p>输入管理员访问码，进入完整工作台。</p><form><input type="password" id="code" aria-label="访问码" placeholder="VA1. 开头的访问码" autocomplete="off" required><button>激活并打开工作台</button></form><p id="status" role="status"></p></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench-Session':'__SESSION__'},body:JSON.stringify({code:document.querySelector('input').value.trim()})});if(!r.ok)throw Error((await r.json()).error);document.querySelector('input').value='';location.reload();}catch(e){document.querySelector('#status').textContent=e.message;}finally{b.disabled=false;}};</script></body></html>
