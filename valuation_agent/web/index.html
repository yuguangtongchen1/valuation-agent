<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采购估价工作台</title><style>
:root{font:15px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif;color:#20302d;background:#f6f9f8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d8e4df;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 16px}button,.file{font:inherit;border:1px solid #c7d8d0;border-radius:7px;background:#fff;color:#205c47;padding:9px 15px;cursor:pointer}button.primary{background:#20634f;color:white;border-color:#20634f}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83bdaa;outline-offset:2px}input,select{font:inherit;padding:10px;border:1px solid #bacfc4;border-radius:6px;max-width:100%}main{padding:28px 4%}.card{background:white;border:1px solid #d8e4df;border-radius:10px;padding:24px;max-width:700px;margin:32px auto}.muted{color:#6b7c75;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.hidden{display:none!important}#status{padding:10px 4%;min-height:45px;color:#38624f}#status.error{color:#a72d24}#workspace{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(260px,1fr);gap:18px;align-items:start}.table-wrap{min-width:0}table{border-collapse:collapse;table-layout:fixed;width:100%;background:#fff;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #dce5e0;vertical-align:top;overflow-wrap:anywhere}th{background:#edf3f0;font-size:13px}td.num,th.num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}tr.selected{background:#e6f1eb}.link{border:0;background:none;padding:0;text-decoration:underline;text-align:left;font-weight:600}#references{background:#fff;border:1px solid #d8e4df;border-radius:8px;max-height:70vh;overflow:auto;position:sticky;top:20px;padding:16px}.ref{border-top:1px solid #e1e9e5;padding:14px 0}.ref-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.price{white-space:nowrap;font-weight:650;color:#205c47}.ref p{margin:5px 0;font-size:13px}.ref small{display:block;color:#78857e;margin-top:6px}.back{margin-bottom:20px}.yellow{background:#fff1b8}.meta{display:grid;grid-template-columns:90px 1fr;gap:8px;background:#edf4ef;padding:18px;border-radius:8px;margin-bottom:24px}.meta dt{color:#5a6c61}.meta dd{margin:0;overflow-wrap:anywhere}#detail{max-width:1200px;margin:auto}#detail h2{margin-top:24px}#detail table{margin-bottom:24px}.section-label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.code-entry{display:flex;gap:10px;margin-top:20px}.code-entry input{flex:1;min-width:0}@media(max-width:900px){#workspace{grid-template-columns:minmax(0,1fr)}#references{position:static;max-height:none}table{font-size:12px}td,th{padding:10px 5px}header{flex-wrap:wrap}}@media(max-width:540px){main{padding:18px 12px}h1{font-size:18px}.card{padding:18px}.code-entry{flex-direction:column}.num{font-size:11px}}
</style><header><h1>采购估价</h1><div class="actions"><span id="account" class="muted"></span><button id="change-account">更换访问码</button><button id="new-project" class="hidden">新报价</button><button id="export" class="primary hidden">导出比价 Excel</button></div></header><div id="status" role="status" aria-live="polite"></div><main>
<section id="activation" class="card hidden"><h2>开通内部数据查询</h2><p>输入管理员提供的访问码，即可使用历史报价进行比价。</p><form id="activate-form" class="code-entry"><input id="code" type="password" autocomplete="off" placeholder="粘贴 VA1. 开头的访问码" aria-label="访问码" required><button class="primary">启用工作台</button></form><p class="muted">访问码仅存于本机配置，不写入浏览器存储。请勿转发。</p></section>
<section id="entry" class="card hidden"><h2>开始一份采购比价</h2><p>选择新项目报价文件</p><input id="file" type="file" accept=".xlsx,.xls,.csv,.json" aria-label="上传报价文件"><div id="sheet-choice" class="actions hidden" style="margin-top:16px"><select id="worksheets" aria-label="工作表"></select><button id="import-sheet" class="primary">读取此工作表</button></div></section>
<section id="work" class="hidden"><div class="section-label"><h2 id="project"></h2><button id="compare" class="primary">开始整单比价</button></div><div id="workspace"><div class="table-wrap"><table><colgroup><col style="width:17%"><col style="width:25%"><col style="width:20%"><col style="width:8%"><col style="width:6%"><col style="width:11%"><col style="width:13%"></colgroup><thead><tr><th>物料 / 服务</th><th>工艺 / 配置</th><th>规格 / 型号</th><th class="num">数量</th><th>单位</th><th class="num">单价（元）</th><th class="num">小计（元）</th></tr></thead><tbody id="quote-rows"></tbody></table></div><aside id="references" aria-label="历史参考报价"><h2>历史参考报价</h2><p class="muted">先完成整单比价，再点单价查看参考。</p></aside></div></section>
<section id="detail" class="hidden"><button class="back" id="back">← 返回报价行</button><h1 id="detail-title"></h1><p id="detail-subtitle" class="muted"></p><dl id="meta" class="meta"></dl><h2>历史合同明细</h2><table><colgroup><col style="width:25%"><col style="width:35%"><col style="width:8%"><col style="width:7%"><col style="width:12%"><col style="width:13%"></colgroup><thead><tr><th>物料 / 服务</th><th>规格 / 型号</th><th class="num">数量</th><th>单位</th><th class="num">单价（元）</th><th class="num">小计（元）</th></tr></thead><tbody id="detail-rows"></tbody></table><h2>规格对照</h2><table><thead><tr><th>参数</th><th>当前规格</th><th>历史规格</th></tr></thead><tbody id="spec-rows"></tbody></table></section>
</main><script>
'use strict';
const session='__SESSION__';let documentData=null,result=null,selected=0,upload=null,configured=false;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null||v===''?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';
const qty=v=>v==null||v===''?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{maximumFractionDigits:6}):String(v);
const text=v=>v==null||v===''?'未注明':v;
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'';}
function view(id){for(const v of ['activation','entry','work','detail'])$(v).classList.toggle('hidden',v!==id);$('new-project').classList.toggle('hidden',!documentData);$('export').classList.toggle('hidden',!result||id==='activation');}
async function call(action,payload,binary=false){const response=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Workbench-Session':session},body:JSON.stringify(payload)});if(!response.ok){const e=await response.json().catch(()=>({}));throw Error(e.error||'请求未完成，请稍后重试。');}return binary?response.blob():response.json();}
function amount(r,field){return r[field+'_cny_yuan']??(r.currency==='CNY'?r[field]:null);}
function refPrice(r){const bundle=r.reference_price_type==='package_total'||r.kind==='whole_scope_quote';return{value:bundle?(r.reference_total_cny_yuan??amount(r,'subtotal')):amount(r,'unit_price'),unit:bundle?'整包':r.reference_rate_unit||r.unit||''};}
function table(){const lines=result?.rows.map(x=>x.quote)||documentData.rows;$('quote-rows').innerHTML=lines.map((q,i)=>`<tr class="${selected===i?'selected':''}"><td>${esc(q.item_name)}</td><td>${esc([q.description,q.configuration].filter(Boolean).join('；'))}</td><td>${esc([q.spec,q.model].filter(Boolean).join(' / '))}</td><td class="num">${esc(qty(q.quantity))}</td><td>${esc(q.unit)}</td><td class="num"><button class="link" data-select="${i}">${money(amount(q,'unit_price'))}</button></td><td class="num">${money(amount(q,'subtotal'))}</td></tr>`).join('');for(const b of $('quote-rows').querySelectorAll('[data-select]'))b.onclick=()=>{selected=Number(b.dataset.select);table();references();};}
function references(){const item=result?.rows[selected];$('references').innerHTML='<h2>历史参考报价</h2>';if(!item){$('references').innerHTML+='<p class="muted">请先完成整单比价。</p>';return;}const refs=item.references||[];if(!refs.length){$('references').innerHTML+='<p>本次未找到可展示的历史参考。</p>';return;}refs.forEach((r,i)=>{const p=refPrice(r);const el=document.createElement('div');el.className='ref';el.innerHTML=`<div class="ref-top"><button class="link" data-ref="${i}">${esc(r.item_name||'关联记录')}</button><button class="link price" data-ref="${i}">¥${money(p.value)} <small>/ ${esc(p.unit)}</small></button></div><p>${esc(r.match_kind||'历史参考')}</p><p>${esc(r.match_reason||'')}</p><small>${esc(r.project||'')}</small>`;$('references').appendChild(el);for(const b of el.querySelectorAll('[data-ref]'))b.onclick=()=>detail(r,item.quote);});}
async function detail(r,q){status('正在读取合同明细…');try{if(!r.record_id)throw Error('此记录没有可读取的合同明细。');const d=await call('contract',{record_id:r.record_id});$('detail-title').textContent=r.project||r.item_name;$('detail-subtitle').textContent=r.supplier||'';$('meta').innerHTML=[['当前物料',q.item_name],['历史物料',r.item_name],['匹配依据',r.match_reason],['报价版本',r.quotation_variant_name||'—']].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');$('detail-rows').innerHTML=d.lines.map(l=>`<tr class="${l.line_id===r.line_id?'selected':''}"><td>${esc(l.item_name)}</td><td>${esc([l.spec,l.model].filter(Boolean).join(' / ')||'未注明')}</td><td class="num">${esc(qty(l.quantity))}</td><td>${esc(l.unit)}</td><td class="num">${money(refPrice(l).unit==='整包'?null:amount(l,'unit_price'))}</td><td class="num">${money(l.reference_total_cny_yuan??amount(l,'subtotal'))}</td></tr>`).join('');$('spec-rows').innerHTML=[['规格 / 型号',[q.spec,q.model].filter(Boolean).join(' / '),[r.spec,r.model].filter(Boolean).join(' / ')],['工艺 / 配置',[q.description,q.configuration].filter(Boolean).join('；'),[r.description,r.configuration].filter(Boolean).join('；')],['计价单位',q.unit,r.unit]].map(([k,a,b])=>`<tr><th>${esc(k)}</th><td class="${a&&b&&a!==b?'yellow':''}">${esc(text(a))}</td><td class="${a&&b&&a!==b?'yellow':''}">${esc(text(b))}</td></tr>`).join('');view('detail');status('');window.scrollTo(0,0);}catch(e){status(e.message,true);}}
$('activate-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;status('正在验证访问码…');try{await call('activate',{code:$('code').value.trim()});$('code').value='';configured=true;$('account').textContent='内部数据查询';view('entry');status('访问已启用，请上传报价文件。');}catch(e){status(e.message,true);}finally{button.disabled=false;}};
$('change-account').onclick=()=>{view('activation');$('code').focus();};$('new-project').onclick=()=>{view('entry');status('');};$('back').onclick=()=>{view('work');};
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;if(file.size>22*1024*1024){status('文件超过22MB，请拆分或提供规范JSON。',true);return;}status('正在读取报价…');try{const bytes=new Uint8Array(await file.arrayBuffer());let text='';for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.subarray(i,i+8192));upload={filename:file.name,content:btoa(text)};await importFile();}catch(e){status(e.message,true);}};
async function importFile(worksheet){const d=await call('import',{...upload,worksheet});if(d.worksheets){$('worksheets').replaceChildren(...d.worksheets.map(v=>new Option(v,v)));$('sheet-choice').classList.remove('hidden');status('请选择要比较的工作表。');return;}documentData=d.document;result=null;selected=0;$('project').textContent=documentData.project||upload.filename;$('sheet-choice').classList.add('hidden');view('work');table();references();status(`已读取 ${documentData.rows.length} 条明细。`);}
$('import-sheet').onclick=()=>importFile($('worksheets').value).catch(e=>status(e.message,true));
$('compare').onclick=async()=>{$('compare').disabled=true;status('正在整单比价，请保持窗口打开…');try{result=await call('compare',{document:documentData});table();references();view('work');status(`已完成 ${result.rows.length} 条明细比价。`);}catch(e){status(e.message,true);}finally{$('compare').disabled=false;}};
$('export').onclick=async()=>{if(!result)return;status('正在导出…');try{const blob=await call('export',{result},true),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='比价结果.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('比价 Excel 已导出。');}catch(e){status(e.message,true);}};
fetch('/health').then(r=>r.json()).then(s=>{configured=s.configured;view(configured?'entry':'activation');$('account').textContent=configured?'内部数据查询':'未激活';}).catch(()=>status('本机服务无法连接，请重新启动 CLI。',true));
</script></html>
